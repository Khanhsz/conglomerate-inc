# Industry pack: coffee (M1). Mọi số tiền tính bằng CENT.
# Đây là giá trị khởi đầu để hiệu chỉnh, không phải số liệu thực nghiệm.
id: coffee
name: { vi: "Chuỗi cà phê", en: "Coffee chain" }

referencePrice: 350          # $3.50 — Pref trong utility
unitCost: 90                 # $0.90 giá vốn / ly ở tier standard, trước CPI
dailyDemandNoise: 0.05       # σ
serviceAdjustRate: 0.2       # κw
customersPerStaffPerDay: 90
minStaffPerStore: 2
moraleWageSensitivity: 6     # k_m
moraleAdjustRate: 0.05       # κm
skillGainPerDay: 0.002
newHireSkill: 0.4
overheadBaseMonthly: 300000  # $3,000
overheadExponent: 1.2        # γo — phi hiệu quả theo quy mô
usefulLifeMonths: 60

newStore:                    # cửa hàng mới mở bằng lệnh OpenStore (spec §3)
  staff: 4
  morale: 0.5
  serviceLevel: 0.6
aiInitialStaff: 5            # cửa hàng ban đầu của AI trong scenario

qualityTiers:
  basic:    { quality: 0.35, unitCostMultiplier: 0.75 }
  standard: { quality: 0.60, unitCostMultiplier: 1.00 }
  premium:  { quality: 0.85, unitCostMultiplier: 1.50 }

brand:
  alpha: 0.01
  halfSaturationDaily: 10000   # $100/ngày ≈ $3,000/tháng
  decayPerDay: 0.003
  wordOfMouth: 0.002
  initialAwareness: 0.05

segments:
  students:
    visitsPerPersonPerDay: 0.045
    maxTravelKm: 4
    outsideUtility: 2.4
    incomeElasticityOfPriceSensitivity: 0
    betas: { q: 1.0, p: 2.5, b: 1.0, d: 0.9, w: 0.8 }
  office:
    visitsPerPersonPerDay: 0.065
    maxTravelKm: 2.5
    outsideUtility: 3.0
    incomeElasticityOfPriceSensitivity: 0
    betas: { q: 1.5, p: 1.5, b: 1.5, d: 1.2, w: 1.2 }
  premium:
    visitsPerPersonPerDay: 0.055
    maxTravelKm: 6
    outsideUtility: 3.4
    incomeElasticityOfPriceSensitivity: 0
    betas: { q: 3.0, p: 1.1, b: 2.0, d: 0.6, w: 1.5 }
  other:
    visitsPerPersonPerDay: 0.012
    maxTravelKm: 3
    outsideUtility: 3.8
    incomeElasticityOfPriceSensitivity: 0
    betas: { q: 1.0, p: 2.0, b: 1.0, d: 1.0, w: 0.5 }

# Luật tháng của AI (economic-model §9). Bot `sensible` dùng cùng luật với ngưỡng mở rộng riêng.
aiRules:
  highUtilization: 0.95        # > → đẩy giá mục tiêu lên
  lowUtilization: 0.6          # < → hạ giá mục tiêu
  priceAdjust: 0.03            # ±3% quanh giá target
  maxPriceStep: 0.05           # giá dịch tối đa ±5%/tháng
  targetUtilization: 0.85      # chọn staff để utilization dự kiến ≈ 0.85
  maxStaffStep: 2              # ±2 người/tháng
  closeAfterNegativeMonths: 3  # đóng cửa hàng lỗ đóng góp 3 tháng liền
  expansion:
    minMonthlyRoi: 0.02        # lãi đóng góp 3 tháng / capex > 2%/tháng
    cashMultiple: 3            # cash ≥ 3 × capex của cửa hàng mới (vòng 1: 1.5 → 3)

aiPersonalities:
  discount: { qualityTier: basic,    markup: 3.7, wageRatio: 0.95, marketingShareOfRevenue: 0.02 }
  balanced: { qualityTier: standard, markup: 3.9, wageRatio: 1.05, marketingShareOfRevenue: 0.04 }
  premium:  { qualityTier: premium,  markup: 4.0, wageRatio: 1.20, marketingShareOfRevenue: 0.06 }

# M1.6 — văn phòng và phòng ban (economic-model §15). Giá trị đề xuất khởi đầu, hiệu chỉnh ở vòng 2 (#59).
office:
  sizes:
    small:  { slots: 2, fitOut: 4000000,  rentMultiplier: 0.6, overheadMonthly: 150000 }   # $40k, $1.5k/tháng
    medium: { slots: 4, fitOut: 8000000,  rentMultiplier: 1.0, overheadMonthly: 300000 }   # $80k, $3k/tháng
    large:  { slots: 5, fitOut: 15000000, rentMultiplier: 1.6, overheadMonthly: 600000 }   # $150k, $6k/tháng

departments:                   # openingCost một lần, fixedMonthly mỗi tháng (trước CPI)
  hr:        { openingCost: 1000000, fixedMonthly: 300000 }   # $10k, $3k
  product:   { openingCost: 2000000, fixedMonthly: 400000 }   # $20k, $4k
  finance:   { openingCost: 1000000, fixedMonthly: 300000 }   # $10k, $3k
  marketing: { openingCost: 1500000, fixedMonthly: 350000 }   # $15k, $3.5k
  board:     { openingCost: 2000000, fixedMonthly: 200000 }   # $20k, $2k (chưa gồm lương C-level)
